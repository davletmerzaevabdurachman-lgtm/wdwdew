services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: abduls_ai
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
  ai-server:
    build: ./ai-server
    environment:
      AI_SERVER_INTERNAL_TOKEN: change-me
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: llama3.2
    ports: ["8000:8000"]
    depends_on: [ollama]
volumes:
  postgres_data:
  ollama_data:
